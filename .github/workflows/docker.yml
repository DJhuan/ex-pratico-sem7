name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY_USER: DJhuan
  IMAGE_NAME: sem7

jobs:
  pipeline:
    name: Pipeline CI/CD
    runs-on: ubuntu-latest

    steps:
      # 1. Código
      - name: 1. Código (Checkout)
        uses: actions/checkout@v4

      # 2. Build
      - name: 2. Build (Configurar Python e dependências)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências e validar código
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile main.py

      # 3. Imagem Docker
      - name: 3. Imagem (Build da imagem Docker)
        run: |
          docker build \
            -t ${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} \
            -t ${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}.0 \
            -t ${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Validar container em execução
        run: |
          docker run -d --name app-test -p 8000:8000 ${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
          sleep 3
          curl --fail http://localhost:8000/hello || exit 1
          docker stop app-test
          docker rm app-test

      # 4. Push para Registry
      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: 4. Push para Registry
        run: |
          docker push ${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
          docker push ${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}.0
          docker push ${{ env.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:latest
